[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadradar"
version = "0.1.0"
description = "Find people asking for what you sell — across LinkedIn, Reddit, X, HN, Bluesky, freelance boards and any site — scored by Claude, delivered to Telegram."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "feedparser>=6",
  "python-dotenv>=1",
  "ddgs>=9",
]

[project.optional-dependencies]
# Stealth fetching + custom site scraping (Scrapling, BSD-3). Run `scrapling install` after.
stealth = ["scrapling[fetchers]>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
leadradar = "leadradar.cli:main"

[tool.setuptools.packages.find]
include = ["leadradar*"]
