# LeadRadar config. Tip: `leadradar init --describe "what you sell and to whom"`
# writes this whole file for your trade. Secrets (API keys, tokens) go in .env or
# GitHub Secrets, never here.

profile:
  # What you sell. Be concrete: Claude scores every post against this.
  offer: |
    I build AI automations and agents for small businesses and freelancers:
    connecting their tools (email, CRM, spreadsheets, WhatsApp, e-commerce) with
    n8n / Make / Zapier and Claude/ChatGPT, customer-support chatbots, lead
    follow-up, document processing, and hands-on AI training for teams.
  ideal_client: |
    Owners of small businesses, agencies, shops, clinics, consultants and
    freelancers who want to save time with AI but don't have a technical team.
    Spain, Latin America or remote English-speaking clients.
  not_a_fit: |
    Big enterprises looking for full-time employees, students asking for homework
    help, people building their own AI startup, other agencies promoting services.
  tone: "cercano, directo y útil; nada de venta agresiva"
  signature: ""          # e.g. "— Ana · ana-automates.com"
  report_language: es    # language of the summaries you receive (es | en | …)

# Phrases your buyers would actually write. Mix languages freely.
# Used by every source unless that source sets its own `queries` (keyword
# APIs like Bluesky/HN find more with short terms — Claude filters intent).
queries:
  - "busco a alguien que automatice"
  - "recomendáis alguna agencia de IA"
  - "necesito ayuda con automatización"
  - "busco freelance n8n"
  - "alguien que me haga un chatbot"
  - "automatizar mi negocio con IA"
  - "looking for someone to automate"
  - "need help with AI automation"
  - "recommend an AI automation agency"
  - "hire n8n developer"
  - "looking for a zapier expert"
  - "freelancer to build a chatbot"

# Drop any candidate containing one of these (case-insensitive).
exclude:
  - "we are hiring"
  - "estamos contratando"
  - "full-time position"
  - "[for hire]"

# Only posts/offers from the last N hours. Every source is filtered by its real
# publication date (Workana's "Hace 2 días", LinkedIn/X ids, API timestamps…).
max_age_hours: 72

sources:
  # ── Free, no key needed ─────────────────────────────────────────────────
  hackernews:
    enabled: true
    queries: ["n8n", "zapier", "make.com", "ai automation", "looking for freelancer automation"]

  bluesky:
    enabled: true
    langs: [es, en]
    queries: ["n8n", "zapier", "automatizar negocio", "automatizar IA", "chatbot negocio", "AI automation help", "recommend automation"]

  freelancer:            # Freelancer.com open projects
    enabled: true
    queries: ["n8n", "zapier", "make.com automation", "ai chatbot", "ai automation"]

  workana:               # Workana projects (Spain/LatAm) — needs the `stealth` extra (installed by default in CI)
    enabled: true
    language: es
    queries: ["automatizacion", "n8n", "chatbot", "inteligencia artificial", "zapier"]

  # ── One key (APIFY_API_TOKEN): LinkedIn + X + Reddit, no accounts/cookies ──
  # Skipped automatically if the key is missing. Pay-per-result on your Apify
  # account (the free plan includes monthly credit): LinkedIn ≈ $2/1k posts,
  # X ≈ $0.40/1k tweets. max_per_query keeps each run to a few cents.
  apify:
    enabled: true
    max_per_query: 10
    x_lang: ""           # e.g. es — restrict X results to one language
    queries: ["busco automatizar", "recomendáis automatización", "necesito chatbot", "looking for automation expert", "need help n8n"]
    actors:
      - preset: linkedin
      - preset: x
      - preset: reddit
      # Any other Apify actor works with your own field mapping:
      # - actor: someuser/some-actor
      #   input: {searchTerms: "{queries}", maxItems: 25}
      #   fields: {url: url, text: text, author: author.name, date: createdAt}
      #   label: example.com

  # ── Optional extras ───────────────────────────────────────────────────────
  web:                   # site: searches (Quora, Indie Hackers, forums…). Best with SERPER_API_KEY.
    enabled: false
    provider: serper     # serper (Google, 2,500 free queries) | ddgs (free, no key, noisy) | brave | exa
    sites:
      - quora.com
      - indiehackers.com
      - linkedin.com/posts
      - x.com
    freshness: week      # day | week | month
    results_per_query: 10
    max_requests: 40     # safety cap on site×query searches per run
    region: es-es

  reddit:                # keyless Reddit RSS — heavily rate-limited, blocked on GitHub Actions.
    enabled: false       # Prefer the apify `reddit` preset. Uses REDDIT_CLIENT_ID/SECRET if you have them.
    subreddits: [smallbusiness, Entrepreneur, automation, n8n, zapier, freelance_forhire, spain, mexico]
    global_search: true

  agentreach:            # Reddit + X with YOUR logged-in session, via the CLIs Agent-Reach installs
    enabled: false       # (rdt-cli, twitter-cli). Against Reddit/X automation terms: secondary
    reddit: true         # account, low volume, LOCAL only (never put cookies in CI).
    x: true              # Setup: https://github.com/Panniantong/Agent-Reach
    x_lang: ""
    max_per_query: 25

  rss:                   # any RSS/Atom feed (job boards, Google Alerts, forums)
    enabled: false
    feeds: []
      # - { name: weworkremotely, url: "https://weworkremotely.com/remote-jobs.rss" }

  scrape:                # any listing page via CSS selectors (Scrapling)
    enabled: false
    pages: []
      # - name: mysite
      #   url: https://example.com/jobs?q=automation
      #   item: ".job"
      #   title: "h2"
      #   link: "a::attr(href)"
      #   text: ".description"
      #   stealth: false   # true = stealth browser (Cloudflare); run `scrapling install` first

scoring:
  model: claude-haiku-4-5  # cheapest (~$0.005 per 15 posts). claude-sonnet-5-5 / claude-opus-5-5 write sharper drafts
  effort: low              # Sonnet/Opus only: low | medium | high
  batch_size: 15           # posts per Claude call
  max_items_per_run: 100   # cost cap; extra items wait for the next run

notify:
  min_score: 60            # 60+ = a buyer explicitly asking for help (vendors and chatter are capped below)
  max_leads: 15            # per run
  telegram:
    enabled: true
    notify_empty: false    # also message when a run finds nothing
  discord:
    enabled: false
  slack:
    enabled: false

storage:
  db_path: data/leadradar.db
  output_dir: output       # leads.csv + leads.html land here
