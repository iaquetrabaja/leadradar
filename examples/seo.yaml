    enabled: true
    queries: &id001
    - SEO
    - consultor SEO
    - SEO local
    - Google Business Profile
    - Shopify SEO
    - WooCommerce SEO
    - auditoría SEO
    - posicionamiento web
  reddit:
    enabled: true
    subreddits:
    - SEO
    - bigseo
    - shopify
    - woocommerce
    - smallbusiness
    - emprendedores
    - spain
    - askspain
    - ecommerce
    - GoogleMyBusiness
