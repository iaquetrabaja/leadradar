# LeadRadar config generated by `leadradar init --describe`.
# Business: Consultor SEO freelance en España. Hago auditorías SEO, SEO local para negocios (Google Business Profile), SEO para tiendas Shopify y WooCommerce, y estrategia de contenidos. Clientes: pymes, tiendas 
# Every option is explained in config.example.yaml. Review the queries — you know your buyers best.

profile:
  offer: 'Consultoría SEO freelance: auditorías SEO técnicas y de contenido, SEO local y optimización
    de Google Business Profile, SEO para tiendas Shopify y WooCommerce, y estrategia de contenidos para
    captar tráfico orgánico que convierte.

    '
  ideal_client: 'Pymes, tiendas online (Shopify/WooCommerce) y negocios locales de España y Latinoamérica
    que no aparecen en Google, han perdido tráfico orgánico o quieren posicionarse en su ciudad, y buscan
    un consultor externo con presupuesto para un proyecto o servicio mensual.

    '
  not_a_fit: 'Agencias SEO buscando subcontratar a precio mínimo, estudiantes o personas que quieren aprender
    SEO, ofertas de empleo a jornada completa, proyectos de link building spam o enlaces comprados, webs
    de apuestas/adultos, y quien busca resultados garantizados en días por muy poco dinero.

    '
  tone: Cercano, profesional y práctico. Responder primero con un consejo útil y concreto sobre su problema
    (sin jerga innecesaria), mostrar experiencia sin vender agresivamente y ofrecer una revisión o conversación
    breve sin compromiso.
  signature: ''
  report_language: es
queries:
- busco consultor SEO
- necesito ayuda con el SEO de mi web
- mi web no aparece en Google
- recomendáis algún experto SEO
- mi tienda Shopify no tiene tráfico
- SEO para WooCommerce ayuda
- he perdido tráfico en Google
- cómo posicionar mi negocio local
- Google Business Profile no aparece
- alguien que me haga una auditoría SEO
- busco freelance SEO España
- necesito posicionar mi tienda online
- recommend an SEO consultant for Shopify
- my website dropped in Google rankings
- quién me recomienda para SEO local
- estrategia de contenidos para mi blog
exclude:
- ofrezco servicios SEO
- ofrecemos servicios
- soy consultor SEO
- curso de SEO
- aprender SEO
- máster SEO
- oferta de empleo
- contrato indefinido
- jornada completa
- we are hiring
- buy backlinks
- venta de enlaces
- guest post
- webinar
- gratis curso
- hiring full-time
- DM me for SEO services
max_age_hours: 72
