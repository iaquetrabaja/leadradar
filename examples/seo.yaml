# LeadRadar config generated by `leadradar init --describe`.
# Business: Consultor SEO freelance en España. Hago auditorías SEO, SEO local para negocios (Google Business Profile), SEO para tiendas Shopify y WooCommerce, y estrategia de contenidos. Clientes: pymes, tiendas
# Every option is explained in config.example.yaml. Review the queries — you know your buyers best.

profile:
  offer: 'Consultoría SEO freelance: auditorías SEO técnicas y de contenido, SEO local con optimización
    de Google Business Profile, SEO para tiendas Shopify y WooCommerce, y estrategia de contenidos orientada
    a captar tráfico y ventas.

    '
  ideal_client: 'Pymes, negocios locales (clínicas, restaurantes, despachos, comercios) y tiendas online
    en Shopify o WooCommerce en España y LatAm que no reciben tráfico orgánico, han perdido posiciones
    o no aparecen en Google Maps y buscan un consultor externo.

    '
  not_a_fit: 'Empresas que buscan contratar un SEO en plantilla a tiempo completo, estudiantes o personas
    que quieren aprender SEO, otras agencias ofreciendo servicios, quienes buscan enlaces baratos o tácticas
    black hat, y proyectos sin presupuesto.

    '
  tone: 'Cercano, profesional y útil: aportar primero un consejo concreto sobre su problema, sin sonar
    a venta agresiva, y ofrecer una auditoría o llamada breve si quieren profundizar.'
  signature: ''
  report_language: es
queries:
- busco consultor SEO
- necesito ayuda con el SEO
- recomendáis alguna agencia SEO
- mi web no aparece en Google
- mi negocio no sale en Google Maps
- ayuda con Google Business Profile
- mi tienda Shopify no tiene tráfico
- SEO para WooCommerce ayuda
- he perdido posiciones en Google
- alguien que me haga una auditoría SEO
- quién me recomienda un experto SEO
- mi web no tiene visitas
- need help with SEO for my Shopify store
- recommend an SEO consultant
- my website dropped in Google rankings
- help with local SEO
exclude:
- ofrezco servicios SEO
- ofrezco mis servicios
- somos una agencia
- oferta de empleo
- se busca SEO a jornada completa
- contrato indefinido
- curso de SEO
- máster SEO
- aprender SEO
- hiring full-time
- I offer SEO services
- DM me for SEO
- backlinks baratos
- guest post for sale
- webinar gratuito
max_age_hours: 72
