# LeadRadar config generated by `leadradar init --describe`.
# Business: Email marketing freelance: estrategia, automatizaciones y newsletters con Klaviyo, Mailchimp, Brevo y ActiveCampaign; flujos de carrito abandonado y bienvenida para e-commerce; migraciones de platafor
# Every option is explained in config.example.yaml. Review the queries — you know your buyers best.

profile:
  offer: 'Email marketing freelance: estrategia, automatizaciones y newsletters con Klaviyo, Mailchimp,
    Brevo y ActiveCampaign. Flujos de carrito abandonado, bienvenida y post-compra para e-commerce, y
    migraciones entre plataformas de email sin perder listas ni automatizaciones.

    '
  ideal_client: 'Tiendas online (Shopify, WooCommerce, PrestaShop) y pequeñas marcas o negocios digitales
    de España, LatAm o mercado global que ya venden y tienen lista de suscriptores, pero no tienen automatizaciones,
    tienen baja apertura/conversión o necesitan migrar de plataforma (p. ej. Mailchimp a Klaviyo o Brevo).

    '
  not_a_fit: 'Empresas que buscan un empleado a tiempo completo, envíos masivos de spam o listas compradas,
    estudiantes buscando cursos, otras agencias ofreciendo servicios, proyectos sin presupuesto o negocios
    sin web ni lista de contactos.

    '
  tone: 'Cercano, profesional y útil: aporta primero un consejo concreto sobre su problema (flujo, entregabilidad,
    segmentación), sin sonar a venta agresiva; ofrece ayuda de forma natural y breve.'
  signature: ''
  report_language: es
queries:
- busco experto en Klaviyo
- necesito ayuda con Mailchimp
- busco freelance email marketing
- cómo configurar carrito abandonado
- migrar de Mailchimp a Brevo
- recomendáis agencia de email marketing
- mis emails no generan ventas
- looking for Klaviyo expert
- need help with email automation
- recommend an email marketing freelancer
- abandoned cart flow not working
- migrate Mailchimp to Klaviyo
- hire someone for newsletter
- my email open rates dropped
- ActiveCampaign automation help
- welcome flow Shopify store help
exclude:
- estoy ofreciendo
- ofrezco mis servicios
- '[for hire]'
- I am offering
- we are hiring full-time
- oferta de empleo
- curso de email marketing
- free course
- webinar
- case study
- certificación
- DM me for services
- job opening
- prácticas
max_age_hours: 72
sources:
  hackernews:
    enabled: true
    queries: &id001
    - Klaviyo
    - Mailchimp
    - email marketing
    - abandoned cart
    - ActiveCampaign
    - Brevo
    - newsletter
    - email automation
  bluesky:
    enabled: true
    langs:
    - es
    - en
    queries: *id001
  freelancer:
    enabled: true
    queries: &id002
    - Klaviyo email flows
    - email marketing automation
    - Mailchimp newsletter
    - ActiveCampaign automation
    - email platform migration
    - Brevo email marketing
  workana:
    enabled: true
    language: es
    queries: *id002
  apify:
    enabled: true
    max_per_query: 10
    x_lang: ''
    queries:
    - looking for a Klaviyo expert
    - busco especialista en email marketing
    - recommendations for email marketing freelancer
    - necesito alguien para newsletter
    - need help setting up email automations
    - alguien que sepa de Klaviyo
    actors:
    - preset: linkedin
    - preset: x
    - preset: reddit
  web:
    enabled: false
    provider: serper
    sites:
    - quora.com
    - indiehackers.com
    - linkedin.com/posts
    - x.com
    - community.shopify.com
    - community.klaviyo.com
    - community.mailchimp.com
    - forobeta.com
    freshness: week
    results_per_query: 10
    max_requests: 40
    region: es-es
  reddit:
    enabled: false
    subreddits:
    - emailmarketing
    - klaviyo
    - shopify
    - ecommerce
    - Emailmarketing
    - smallbusiness
    - entrepreneur
    - marketing
    - forhire
    - DigitalMarketing
    global_search: true
  agentreach:
    enabled: false
    reddit: true
    x: true
    x_lang: ''
    max_per_query: 25
  rss:
    enabled: false
    feeds: []
  scrape:
    enabled: false
    pages: []
scoring:
  model: claude-haiku-4-5
  effort: low
  batch_size: 15
  max_items_per_run: 100
notify:
  min_score: 60
  max_leads: 15
  telegram:
    enabled: true
    notify_empty: false
  discord:
    enabled: false
  slack:
    enabled: false
storage:
  db_path: data/leadradar.db
  output_dir: output
