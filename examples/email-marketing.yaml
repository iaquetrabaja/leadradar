# LeadRadar config generated by `leadradar init --describe`.
# Business: Email marketing freelance: estrategia, automatizaciones y newsletters con Klaviyo, Mailchimp, Brevo y ActiveCampaign; flujos de carrito abandonado y bienvenida para e-commerce; migraciones de platafor
# Every option is explained in config.example.yaml. Review the queries — you know your buyers best.

profile:
  offer: 'Email marketing freelance para e-commerce: estrategia, automatizaciones (carrito abandonado,
    bienvenida, post-compra, winback), newsletters y campañas con Klaviyo, Mailchimp, Brevo y ActiveCampaign;
    migraciones entre plataformas y mejora de entregabilidad (SPF, DKIM, DMARC, spam).

    '
  ideal_client: 'Tiendas online (Shopify, WooCommerce, PrestaShop) y marcas DTC en España, Latinoamérica
    o mercados angloparlantes que ya venden, tienen lista de suscriptores y quieren aumentar ingresos
    por email, montar flujos automatizados, migrar de plataforma o resolver problemas de entregabilidad.

    '
  not_a_fit: 'Empresas que buscan contratar un empleado a jornada completa, quienes quieren comprar bases
    de datos o hacer envíos masivos en frío/spam, estudiantes, otros freelancers que se promocionan, proyectos
    sin tienda ni lista, y ofertas de presupuesto ínfimo o pago solo por comisión.

    '
  tone: 'Cercano, profesional y práctico: aportar primero un consejo concreto y útil sobre su problema
    (flujo, plataforma o entregabilidad), sin sonar a venta agresiva; ofrecer ayuda de forma breve al
    final. En español o inglés según el idioma del post.'
  signature: ''
  report_language: es
queries:
- busco experto en Klaviyo
- necesito ayuda con email marketing
- recomendáis freelance de email marketing
- mis correos llegan a spam
- flujo de carrito abandonado no funciona
- migrar de Mailchimp a Klaviyo
- alguien que me lleve la newsletter
- automatizaciones en Brevo ayuda
- looking for a Klaviyo expert
- recommend an email marketing freelancer
- need help with abandoned cart flow
- my emails are going to spam
- Shopify email flows not converting
- help migrating from Mailchimp to Klaviyo
- ActiveCampaign automation help needed
- low open rates on my newsletter
exclude:
- estamos contratando
- oferta de empleo
- full-time
- we're hiring
- job opening
- curso de email marketing
- course
- webinar
- I offer
- ofrezco mis servicios
- DM me for
- my agency
- buy email list
- comprar base de datos
- affiliate
- tutorial
max_age_hours: 72
sources:
  hackernews:
    enabled: true
    queries: &id001
    - Klaviyo
    - email marketing
    - abandoned cart
    - email deliverability
    - Mailchimp
    - ActiveCampaign
    - Brevo
    - newsletter
  reddit:
    enabled: true
    subreddits:
    - emailmarketing
    - klaviyo
    - shopify
    - ecommerce
    - DTC
    - smallbusiness
    - Emailmarketing
    - marketing
    - ecommercemarketing
    - Entrepreneur
    global_search: true
  bluesky:
    enabled: true
    langs:
    - es
    - en
    queries: *id001
  freelancer:
    enabled: true
    queries: &id002
    - Klaviyo email flows
    - email marketing automation
    - Mailchimp newsletter
    - ActiveCampaign automation
    - email deliverability
    - email marketing e-commerce
  workana:
    enabled: true
    language: es
    queries: *id002
  apify:
    enabled: false
    max_per_query: 25
    queries:
    - busco freelance email marketing
    - recomendaciones experto Klaviyo
    - looking for Klaviyo specialist
    - need email marketing freelancer
    - recommend email marketing consultant
    - busco ayuda con newsletter
    actors:
    - preset: linkedin
  web:
    enabled: true
    provider: ddgs
    sites:
    - linkedin.com/posts
    - x.com
    - quora.com
    - indiehackers.com
    - reddit.com
    - community.shopify.com
    - community.klaviyo.com
    - community.mailchimp.com
    - forocoches.com
    freshness: week
    results_per_query: 10
    max_requests: 40
    region: es-es
  rss:
    enabled: false
    feeds: null
  scrape:
    enabled: false
    pages: []
scoring:
  model: claude-opus-5-5
  effort: low
  batch_size: 15
  max_items_per_run: 150
notify:
  min_score: 70
  max_leads: 15
  telegram:
    enabled: true
    notify_empty: false
  discord:
    enabled: false
  slack:
    enabled: false
storage:
  db_path: data/leadradar.db
  output_dir: output
